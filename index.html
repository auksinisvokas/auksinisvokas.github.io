<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Auksinis vokas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --cream:#f4efe6; --ink:#2b241d; --muted:#6f6355; --gold:#a8822f; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--cream); color:var(--ink); font:300 17px/1.6 Outfit, sans-serif; text-align:center; padding:32px 16px; }
  .seal { width:64px; height:64px; margin:0 auto 22px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #e9cf8e, #c9a24e 45%, #8a6420); box-shadow:0 2px 6px rgba(80,55,15,.25); }
  h1 { font:400 40px/1.1 Marcellus, serif; margin:0 0 10px; letter-spacing:.02em; }
  p { margin:0 auto; max-width:30em; color:var(--muted); }
  .line { width:56px; height:1px; background:var(--gold); margin:22px auto; }
  a { color:var(--gold); text-decoration:none; border-bottom:1px solid currentColor; }
</style>
</head>
<body>
  <main>
    <div class="seal" aria-hidden="true"></div>
    <h1>Auksinis vokas</h1>
    <p>Skaitmeniniai kvietimai vestuvėms, krikštynoms ir gimtadieniams.</p>
    <div class="line"></div>
    <p>Netrukus. Kol kas mus rasite <a href="https://www.instagram.com/auksinisvokas/">Instagram</a>.</p>
  </main>
</body>
</html>
